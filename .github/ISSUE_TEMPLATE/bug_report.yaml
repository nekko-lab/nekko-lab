name: バグ報告
description: 「本来できるはずのこと」ができない・表示や動きがおかしいときはこちら
title: "[バグ] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        サークル内のすべてのサービス・リポジトリの不具合をここで受け付けています。

        ## どちらを選べばよいか迷ったら

        - **本来できるはずのことが、できない・おかしい** → こちらの「バグ報告」でOKです
        - **今できないことを、できるようにしてほしい** → 「新機能・改良要望」を選んでください

  - type: dropdown
    id: target-category
    attributes:
      label: どの分野で起きましたか
      description: 一番近いものを1つ選んでください。分からない場合は「わからない・全体のこと」で構いません。
      options:
        - 仮想化基盤（Proxmox VE/Backpu Server・Kubernetes）
        - ネットワーク
        - Webサービス・Webサイト
        - 監視・ログ・運用
        - Discord Bot
        - GitHub（リポジトリ・Project・Actions）
        - ドキュメント・Wiki
        - わからない・全体のこと
    validations:
      required: true

  - type: input
    id: target-name
    attributes:
      label: 対象のサービス名・リポジトリ名（任意）
      description: 分かる場合は書いてください。
      placeholder: 例）pvectl
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 起きたこと
      description: 実際に起きたことを書いてください。エラーメッセージが出た場合は、その文言をそのまま貼ってください。
      placeholder: |
        例）
        pvectlでVMを起動しようとしたら「permission denied」と表示され、VMが起動しませんでした。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 本来どうなるはずだと思いましたか
      description: 「こうなると思っていた」という期待を書いてください。
      placeholder: |
        例）
        いつも通りVMが起動し、SSHで接続できるはずでした。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 同じことが起きるまでの手順
      description: 上から順に、番号を付けて書いてください。途中まででも構いません。
      placeholder: |
        例）
        1. 部室のPCからVPNに接続する
        2. ターミナルで `pvectl start 100` を実行する
        3. エラーが表示される
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: どのくらいの頻度で起きますか
      options:
        - 毎回起きる
        - ときどき起きる
        - 一度だけ起きた
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 活動への影響
      options:
        - 作業が止まる（先に進めない・サービスが使えない・データが失われる）
        - 回避策はあるが手間がかかる
        - 軽微（見た目の乱れなど、作業は続けられる）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 実行したコマンド・ログ（任意）
      description: コマンドやエラー出力があれば、そのまま貼ってください。自動で整形されます。
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: スクリーンショット（任意）
      description: この枠に画像をドラッグ＆ドロップすると添付できます。Web画面の不具合などは、画像があると助かります。
      placeholder: ここに画像をドラッグ＆ドロップしてください。
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 発生日時・使っていた環境（任意）
      description: 分かる範囲で構いません。「いつ」「どこから」「どのバージョンで」が分かると調査が早くなります。
      placeholder: |
        例）
        - 発生日時: 2026年9月16日 14時ごろ
        - 使っていた端末・OS: 私物のMac（macOS 15）
        - 接続元: 学内ネットワーク / 自宅からVPN
        - 対象のバージョン: pvectl v0.3.0
        - 対象のノード・VMID・URL など: pve01 / VMID 100
    validations:
      required: false
