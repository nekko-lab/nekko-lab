name: 新機能・改良要望
description: 「今できないこと」をできるようにしてほしい・もっと使いやすくしてほしいという要望を送るときはこちら
title: "[要望] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        サークル内のすべてのサービス・リポジトリへの要望をここで受け付けています。

        ## どちらを選べばよいか迷ったら

        - **今できないことを、できるようにしてほしい** → こちらの「新機能・改良要望」でOKです
        - **本来できるはずのことが、できない・おかしい** → 「バグ報告」を選んでください

  - type: dropdown
    id: target-category
    attributes:
      label: どの分野についての要望ですか
      description: 一番近いものを1つ選んでください。分からない場合は「わからない・全体のこと」で構いません。
      options:
        - 仮想化基盤（Proxmox VE/Backpu Server・Kubernetes）
        - ネットワーク
        - Webサービス・Webサイト
        - 監視・ログ・運用
        - Discord Bot
        - GitHub（リポジトリ・Project・Actions）
        - ドキュメント・Wiki
        - わからない・全体のこと
    validations:
      required: true

  - type: input
    id: target-name
    attributes:
      label: 対象のサービス名・リポジトリ名（任意）
      description: 分かる場合は書いてください。
      placeholder: 例）pvectl
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 困っていること・そうしたい理由
      description: 「何をしようとして」「どこで手が止まったり手間がかかったりしたか」を書いてください。
      placeholder: |
        例）
        pvectlではマイグレーションを1台ずつしか実行できず、ノードのメンテナンス前に全VMを移すのに時間がかかる。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: こうなってほしい（やりたいこと）
      description: 理想の状態を書いてください。実現方法まで考えなくて大丈夫です。
      placeholder: |
        例）
        引数でVMIDを複数指定して、マイグレーションを一括で実行できるようにしてほしい。
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 今はどうやって対応していますか（任意）
      description: 代わりに使っているツールや手作業があれば教えてください。改善の優先順位を決める参考にします。
      placeholder: |
        例）
        Proxmox VEのWeb画面を開き、qmコマンドを1台ずつ実行している。
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: 急ぎ度
      description: あくまで目安で構いません。
      options:
        - すぐに必要（今の活動・運用が回らず困っている）
        - 近いうちに欲しい（数週間〜1か月以内）
        - いつでもよい（あると嬉しい程度）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 参考資料・補足（任意）
      description: スクリーンショット、参考にしたいツール、関連するIssueなどがあれば貼ってください。画像はこの枠にドラッグ＆ドロップで添付できます。
      placeholder: |
        例）
        参考にしたい他ツールのドキュメントのURLを貼ります。他のメンバー2名からも同じ要望が出ています。
    validations:
      required: false
