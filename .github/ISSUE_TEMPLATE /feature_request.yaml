name: 新機能・改良要望
description: 「今できないこと」をできるようにしてほしい・もっと使いやすくしてほしいという要望を送るときはこちら
title: "[要望] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## どちらを選べばよいか迷ったら

        - **今できないことを、できるようにしてほしい** → こちらの「新機能・改良要望」でOKです
        - **本来できるはずのことが、できない・おかしい** → 「バグ報告」を選んでください

  - type: dropdown
    id: target-feature
    attributes:
      label: どの機能についての要望ですか
      description: 一番近いものを1つ選んでください。分からない場合は「わからない・全体のこと」で構いません。
      options:
        - pvectl --options
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること・そうしたい理由
      description: 「何をしようとして」「どこで手が止まったり手間がかかったりしたか」を書いてください。
      placeholder: |
        例）
        pvectlではマイグレーションを一括で実行することができない、引数でVMIDを複数指定して一括実行できるようにして
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: こうなってほしい（やりたいこと）
      description: 理想の状態を書いてください。実現方法まで考えなくて大丈夫です。
      placeholder: |
        例）
        qmコマンドで実行できる○○をpvectlに追加して
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 今はどうやって対応していますか（任意）
      description: 代わりに使っているツールや手作業があれば教えてください。改善の優先順位を決める参考にします。
      placeholder: |
        例）
        ブラウザを開いてProxmox VEのGUIを確認し、どうしても実行が必要なものはqmコマンドをブラウザ上で実行している
    validations:
      required: false

  - type: dropdown
    id: urgency
    attributes:
      label: 急ぎ度
      description: あくまで目安で構いません。
      options:
        - すぐに必要（今の業務が回らず困っている）
        - 近いうちに欲しい（数週間〜1か月以内）
        - いつでもよい（あると嬉しい程度）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 参考資料・補足（任意）
      description: 画面のスクリーンショット、他ツールの例、関係者などがあれば貼ってください。画像はこの枠にドラッグ＆ドロップで添付できます。
      placeholder: |
        例）
        参考にしたい他ツールの画面を添付します。同じ部署の3名からも同じ要望が出ています。
    validations:
      required: false
